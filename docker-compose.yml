services:

  # # -------------------------------------------------------
  # # MySQL Database
  # # -------------------------------------------------------
  # db:
  #   image: mysql:8
  #   container_name: ris_db
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${DB_DATABASE}
  #     MYSQL_USER: ${DB_USERNAME}
  #     MYSQL_PASSWORD: ${DB_PASSWORD}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ris_db_data:/var/lib/mysql
  #   networks:
  #     - ris_network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # -------------------------------------------------------
  # Laravel Backend
  # -------------------------------------------------------
  services:
  backend:
    build:
      context: ./registrar-backend
      dockerfile: Dockerfile
    image: ris_backend_image
    container_name: ris_backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}                            # ← was hardcoded "db", now reads .env
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_BASE_URL: ${SSO_BASE_URL}
      SSO_SUPERADMIN_EMAIL: ${SSO_SUPERADMIN_EMAIL}
      SSO_SUPERADMIN_PASSWORD: ${SSO_SUPERADMIN_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      AZURE_STORAGE_NAME: ${AZURE_STORAGE_NAME}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}  # ← NEW
      SESSION_DOMAIN: ${SESSION_DOMAIN}                       # ← NEW
    ports:
      - "8000:8000"
    volumes:
      - ./registrar-backend:/var/www/html
    networks:
      - ris_network

  # -------------------------------------------------------
  # Laravel Reverb (WebSocket Server)
  # -------------------------------------------------------
  reverb:
    image: ris_backend_image
    container_name: ris_reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}                            # ← fixed here too
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
    ports:
      - "8080:8080"
    volumes:
      - ./registrar-backend:/var/www/html
    depends_on:
      backend:
        condition: service_started
    networks:
      - ris_network

  # -------------------------------------------------------
  # React Frontend
  # -------------------------------------------------------
  frontend:
    build:
      context: ./registrar-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    container_name: ris_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ris_network

volumes:
  ris_db_data:

networks:
  ris_network:
    driver: bridge