services:
  backend:
    build:
      context: ./registrar-backend
    container_name: ris_staging_backend
    restart: unless-stopped
    env_file: .env.staging
    ports:
      - "8000:8000"
    depends_on: [mysql, redis]
    networks: [ris_staging_network]

  reverb:
    build:
      context: ./registrar-backend
    container_name: ris_staging_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env.staging
    ports:
      - "8080:8080"
    depends_on: [backend]
    networks: [ris_staging_network]

  worker:
    build:
      context: ./registrar-backend
    container_name: ris_staging_worker
    restart: unless-stopped
    command: >
      php artisan queue:work
        --queue=default
        --sleep=3
        --tries=3
        --timeout=300
    env_file: .env.staging
    depends_on: [backend]
    networks: [ris_staging_network]

  broadcast-worker:
    build:
      context: ./registrar-backend
    container_name: ris_staging_broadcast_worker
    restart: unless-stopped
    command: >
      php artisan queue:work database
        --queue=broadcasts
        --sleep=1
        --tries=3
        --timeout=30
    env_file: .env.staging
    depends_on: [backend]
    networks: [ris_staging_network]

  scheduler:
    build:
      context: ./registrar-backend
    container_name: ris_staging_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction >> /var/log/scheduler.log 2>&1; sleep 60; done"
    env_file: .env.staging
    depends_on: [backend]
    networks: [ris_staging_network]

  mysql:
    image: mysql:8.0
    container_name: ris_staging_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: registrar_information_system
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ris_staging_db_data:/var/lib/mysql
    networks: [ris_staging_network]

  redis:
    image: redis:7-alpine
    container_name: ris_staging_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [ris_staging_network]

volumes:
  ris_staging_db_data:

networks:
  ris_staging_network:
    driver: bridge