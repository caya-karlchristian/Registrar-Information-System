services:
  # -------------------------------------------------------
  # React Frontend (local dev only — replaced by S3/CloudFront in prod)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./registrar-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        VITE_SSO_CLIENT_ID: ${SSO_CLIENT_ID}
    container_name: ris_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ris_network
