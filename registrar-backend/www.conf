; PHP-FPM pool configuration for the RIS backend.
; This file is copied into /usr/local/etc/php-fpm.d/www.conf by the Dockerfile,
; overriding the default pool config from the php:8.4-fpm base image.
;
; The key addition is `umask = 0022` which ensures that files created by
; PHP-FPM (uploaded logos, generated files) are world-readable (mode 0644)
; and directories are world-traversable (mode 0755) so nginx can serve them
; without requiring a manual chmod after every upload.

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; Set umask so uploaded/created files are readable by nginx (also www-data,
; but running with a different process context in some configurations).
; 0022 → files: 0644 (rw-r--r--)  directories: 0755 (rwxr-xr-x)

pm = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
