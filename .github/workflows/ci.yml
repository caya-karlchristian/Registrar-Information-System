name: RIS Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'registrar-backend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'registrar-backend/**'

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registrar-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none

      - name: Copy .env
        run: cp .env.example .env.ci

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate --env=ci

      - name: Copy .env
        run: |
          cp .env.example .env
          echo "REVERB_APP_KEY=testkey" >> .env
          echo "REVERB_APP_ID=123456" >> .env
          echo "REVERB_APP_SECRET=testsecret" >> .env
          echo "BROADCAST_CONNECTION=null" >> .env

      - name: Run tests
        run: php artisan test --env=ci
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: null
          ALUMNI_MOCK: "true"
          CASHIER_API_KEY: ""
