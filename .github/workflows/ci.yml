name: RIS Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'registrar-backend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'registrar-backend/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registrar-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none

      - name: Create .env
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=RIS
          APP_ENV=testing
          APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==
          APP_DEBUG=false
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          BROADCAST_CONNECTION=log
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          SESSION_DRIVER=array
          REVERB_APP_ID=123456
          REVERB_APP_KEY=testkey
          REVERB_APP_SECRET=testsecret
          REVERB_HOST=localhost
          REVERB_PORT=8080
          REVERB_SCHEME=http
          ALUMNI_MOCK=true
          CASHIER_API_KEY=
          ENVEOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: php artisan test
