name: Playwright Tests
on:
  push:
    branches: [develop, main]
    paths:
      - 'registrar-frontend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'registrar-frontend/**'

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: registrar-frontend

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Check Ubuntu apt sources
      working-directory: /
      run: |
        echo "=== Ubuntu Version ==="
        cat /etc/os-release

        echo "=== APT Sources ==="
        grep -R "azure.archive.ubuntu.com\|archive.ubuntu.com" \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/ 2>/dev/null || true
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: registrar-frontend/playwright-report/
        retention-days: 30
