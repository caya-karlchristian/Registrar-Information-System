name: Deploy RIS to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Registrar-Information-System
            git pull origin main

            # Regenerate .env from secrets
            cat > .env << 'EOF'
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.VM_HOST }}
            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            AZURE_STORAGE_NAME=${{ secrets.AZURE_STORAGE_NAME }}
            AZURE_STORAGE_KEY=${{ secrets.AZURE_STORAGE_KEY }}
            AZURE_STORAGE_CONTAINER=${{ secrets.AZURE_STORAGE_CONTAINER }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            EOF

            # Rebuild and restart containers
            docker compose up --build -d

            # Run any new migrations
            docker exec ris_backend php artisan migrate --force