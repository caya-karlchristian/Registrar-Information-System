name: RIS Production Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Run the full test suite before touching production.
  # Deploy only proceeds if this passes.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: PHP Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registrar-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none

      - name: Create .env
        run: |
          echo "APP_NAME=RIS" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "BROADCAST_CONNECTION=log" >> .env
          echo "BROADCAST_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "REVERB_APP_ID=123456" >> .env
          echo "REVERB_APP_KEY=testkey" >> .env
          echo "REVERB_APP_SECRET=testsecret" >> .env
          echo "REVERB_HOST=localhost" >> .env
          echo "REVERB_PORT=8080" >> .env
          echo "REVERB_SCHEME=http" >> .env
          echo "ALUMNI_MOCK=true" >> .env
          echo "CASHIER_API_KEY=" >> .env
          echo "SSO_BASE_URL=http://localhost" >> .env
          echo "SSO_CLIENT_ID=test-client" >> .env
          echo "SSO_CLIENT_SECRET=test-secret" >> .env
          echo "ANTHROPIC_API_KEY=" >> .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy backend to EC2.
  # SSHes in, pulls latest code, prunes Docker disk space, rebuilds containers,
  # runs migrations, and recaches config/routes.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (EC2)
    runs-on: ubuntu-latest
    needs: test  # only runs if tests pass

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Registrar-Information-System

            echo "── Pulling latest code ──────────────────────────"
            git pull origin main

            echo "── Pruning Docker build cache ───────────────────"
            docker builder prune -f --filter "until=24h"

            echo "── Rebuilding containers ────────────────────────"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "── Publishing Telescope assets ──────────────────"
            docker exec ris_backend php artisan vendor:publish --tag=telescope-assets --force

            echo "── Caching config and routes ────────────────────"
            docker exec ris_backend php artisan config:cache
            docker exec ris_backend php artisan route:cache

            echo "── Verifying containers are up ──────────────────"
            docker compose ps

            echo "── Done ─────────────────────────────────────────"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build and deploy frontend to S3 + invalidate CloudFront cache.
  # Runs in parallel with deploy-backend since they are independent.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: test  # only runs if tests pass

    defaults:
      run:
        working-directory: registrar-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: registrar-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SSO_LOGIN_URL: ${{ secrets.VITE_SSO_LOGIN_URL }}
          VITE_SSO_CLIENT_ID: ${{ secrets.VITE_SSO_CLIENT_ID }}
          VITE_SSO_BASE_URL: ${{ secrets.VITE_SSO_BASE_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync build to S3
        run: |
          aws s3 sync ./dist s3://ris-frontend-app/ \
            --delete \
            --region ap-southeast-1

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'
